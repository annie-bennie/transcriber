name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      HF_HUB_OFFLINE: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create a clean environment
        shell: python
        run: |
          import os
          import venv
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "transcriber-venv"
          venv.create(root, with_pip=True)
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as path:
              print(root / ("Scripts" if os.name == "nt" else "bin"), file=path)
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.8.0+cpu torchaudio==2.8.0+cpu --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install . ruff
      - run: python -m pip check
      - run: python tests/test_pipeline.py
      - run: ruff check .
      - run: transcribe --help
        working-directory: ${{ runner.temp }}
      - run: python tests/test_installed_cli.py
