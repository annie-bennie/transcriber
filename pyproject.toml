[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcriber"
version = "0.6.0"
description = "Local transcription with speaker separation and speech measurement"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
keywords = ["whisper", "speech-to-text", "speaker-diarization", "speech-emotion",
            "paralinguistics", "meeting-transcription"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# the same environment as requirements.txt. torch and torchaudio are not listed: they have
# to be installed first, at 2.8.0 and from the index that matches the hardware — see
# docs/install.md.
dependencies = [
    "openai-whisper==20250625",
    "pyannote.audio @ https://github.com/BUTSpeechFIT/DiariZen/archive/844f5555b0a98acd0931511fc641a8c5b8ba92c7.zip#subdirectory=pyannote-audio",
    "diarizen @ https://github.com/BUTSpeechFIT/DiariZen/archive/844f5555b0a98acd0931511fc641a8c5b8ba92c7.zip",
    "numpy==1.26.4",
    "accelerate==1.6.0",
    "h5py",
    "librosa",
    "scikit-learn",
    "pyyaml",
    "toml",
    "transformers==4.50.0",
    "huggingface_hub==0.36.0",
    "soundfile>=0.12",
    "psutil>=5.9",
    "tqdm",
    "imageio-ffmpeg==0.6.0",
]

[project.optional-dependencies]
# voice quality: jitter, shimmer, HNR. off by default, see docs/measurements.md.
voice = ["praat-parselmouth>=0.4"]
# benchmarks against public datasets, tools/benchmark.py.
bench = ["datasets>=4.0", "jiwer>=3.0", "scikit-learn>=1.3"]
# a youtube link or playlist as the input
url = ["yt-dlp>=2024.1"]
# --live: listening to a microphone. not in the main list on purpose — the offline pipeline never
# touches an input device, and on linux this needs a system portaudio next to the wheel.
live = ["sounddevice>=0.4"]

[project.scripts]
transcribe = "transcriber.cli:run"

[project.urls]
Repository = "https://github.com/annie-bennie/transcriber"

[tool.setuptools]
packages = ["transcriber"]

[tool.ruff]
line-length = 95
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    # module-level imports are deliberately deferred in places: torch and whisper cost
    # seconds to import, and a run that skips a stage should not pay for them.
    "E402",
]
