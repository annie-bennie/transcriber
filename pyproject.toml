[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcriber"
version = "0.6.0"
description = "Local transcription with speaker separation and speech measurement"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["whisper", "speech-to-text", "speaker-diarization", "speech-emotion",
            "paralinguistics", "meeting-transcription"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# torch and torchaudio are deliberately unpinned and not listed here. they must be
# installed first, matched to the hardware, or pip will happily pull a build with no
# support for the card in the machine. see docs/install.md.
dependencies = [
    "openai-whisper>=20240930",
    "pyannote.audio>=3.1",
    "transformers>=4.40",
    "soundfile>=0.12",
    "numpy>=1.26",
    "psutil>=5.9",
]

[project.optional-dependencies]
# voice quality: jitter, shimmer, HNR. off by default, see docs/measurements.md.
voice = ["praat-parselmouth>=0.4"]
# benchmarks against public datasets, tools/benchmark.py.
bench = ["datasets>=4.0", "jiwer>=3.0", "scikit-learn>=1.3"]

[project.scripts]
transcribe = "transcriber.cli:run"

[project.urls]
Repository = "https://github.com/annie-bennie/transcriber"

[tool.setuptools]
packages = ["transcriber"]

[tool.ruff]
line-length = 95
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    # module-level imports are deliberately deferred in places: torch and whisper cost
    # seconds to import, and a run that skips a stage should not pay for them.
    "E402",
]
